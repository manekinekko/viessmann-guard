[project]
name = "viessmann-guard"
version = "0.4.0"
description = "Read-only hydraulic flow monitoring for existing Home Assistant entities"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.366",
  "ruff==0.15.7",
  "mypy==1.19.1",
  "PyTurboJPEG==1.8.3",
  "mutagen==1.48.1",
  "ha-ffmpeg==3.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
files = ["custom_components/viessmann_guard"]
